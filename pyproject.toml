[project]
name = "playground"
version = "0.1.0"
description = "Throwaway target for exercising Developer pipelines"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playground"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
